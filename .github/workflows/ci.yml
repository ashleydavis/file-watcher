# Builds and tests the file watcher on every platform it supports, without a matrix. Each
# platform has one build job that saves its output to a cache keyed by the commit SHA, and test
# jobs that restore that build instead of building again. The test jobs can land on machines with
# older CPUs than the build job, so every build targets the baseline CPU; a build for the build
# machine's own CPU crashed there with illegal instructions. Each platform and kind of test has
# its own job, so the run overview shows exactly which one failed. The performance jobs write
# their results to the job summary. Only pushes trigger a run, so each commit runs once, and a
# newer push cancels the runs still going for the same branch.

name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build:
    name: Linux build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build the unit tests
        run: zig build -Dcpu=baseline install-tests

      - name: Build the CLI tool
        run: zig build -Dcpu=baseline

      - name: Build the CLI tool for performance tests
        run: zig build -Dcpu=baseline -Doptimize=ReleaseFast --prefix zig-out/release

      - name: Save the build for the test jobs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: linux-build-${{ github.sha }}

  linux-unit:
    name: Linux unit tests
    runs-on: ubuntu-24.04
    needs: linux-build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: linux-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Unit tests
        run: |
          zig-out/tests/library-tests
          zig-out/tests/cli-tests

  linux-smoke:
    name: Linux smoke tests
    runs-on: ubuntu-24.04
    needs: linux-build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: linux-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Smoke tests
        run: scripts/smoke-test.sh zig-out/bin/file-watcher

  linux-performance:
    name: Linux performance tests
    runs-on: ubuntu-24.04
    needs: linux-build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: linux-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Performance tests
        run: scripts/performance-test.sh zig-out/release/bin/file-watcher 20000 "$GITHUB_STEP_SUMMARY" "Linux performance"

  windows-build:
    name: Windows build
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build the unit tests
        run: zig build -Dcpu=baseline install-tests

      - name: Build the CLI tool
        run: zig build -Dcpu=baseline

      - name: Build the CLI tool for performance tests
        run: zig build -Dcpu=baseline -Doptimize=ReleaseFast --prefix zig-out/release

      - name: Save the build for the test jobs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: windows-build-${{ github.sha }}

  windows-unit:
    name: Windows unit tests
    runs-on: windows-2025
    needs: windows-build
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: windows-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Unit tests
        run: |
          zig-out/tests/library-tests.exe
          zig-out/tests/cli-tests.exe

  windows-smoke:
    name: Windows smoke tests
    runs-on: windows-2025
    needs: windows-build
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: windows-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Smoke tests
        run: scripts/smoke-test.sh zig-out/bin/file-watcher.exe

  windows-performance:
    name: Windows performance tests
    runs-on: windows-2025
    needs: windows-build
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: windows-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Performance tests
        run: scripts/performance-test.sh zig-out/release/bin/file-watcher.exe 20000 "$GITHUB_STEP_SUMMARY" "Windows performance"

  macos-build:
    name: macOS build
    runs-on: macos-15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0

      - name: Build the unit tests
        run: zig build -Dcpu=baseline install-tests

      - name: Build the CLI tool
        run: zig build -Dcpu=baseline

      - name: Build the CLI tool for performance tests
        run: zig build -Dcpu=baseline -Doptimize=ReleaseFast --prefix zig-out/release

      - name: Save the build for the test jobs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: macos-build-${{ github.sha }}

  macos-unit:
    name: macOS unit tests
    runs-on: macos-15
    needs: macos-build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: macos-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Unit tests
        run: |
          zig-out/tests/library-tests
          zig-out/tests/cli-tests

  macos-smoke:
    name: macOS smoke tests
    runs-on: macos-15
    needs: macos-build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: macos-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Smoke tests
        run: scripts/smoke-test.sh zig-out/bin/file-watcher

  macos-performance:
    name: macOS performance tests
    runs-on: macos-15
    needs: macos-build
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: zig-out
          key: macos-build-${{ github.sha }}
          fail-on-cache-miss: true


      - name: Install bash 5
        # The performance script needs bash 5 for its microsecond clock; macOS ships bash 3.2.
        run: brew install bash
      - name: Performance tests
        run: |
          "$(brew --prefix)/bin/bash" scripts/performance-test.sh zig-out/release/bin/file-watcher 20000 "$GITHUB_STEP_SUMMARY" "macOS performance"
